name: Docker Build Test

on:
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t expense-tracker-backend ./backend

      - name: Show Docker image
        run: |
          docker images expense-tracker-backend
