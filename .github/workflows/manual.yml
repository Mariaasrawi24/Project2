name: Self-Hosted Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test runner
        run: |
          echo "Hello from my self-hosted runner!"
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"

      - name: Test Ubuntu
        run: |
          echo "Current user:"
          whoami
          echo "Current directory:"
          pwd
          echo "Ubuntu system:"
          uname -a
